# Novel OS - Nginx Reverse Proxy Configuration
# Deploy to: /etc/nginx/sites-available/novel-os (symlink to sites-enabled)
# Test: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name novel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name novel.example.com;

    # ===== SSL =====
    ssl_certificate     /etc/nginx/ssl/novel.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/novel.example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ===== MCP SSE Endpoint =====
    # Must come BEFORE the general web UI location to take priority
    location /mcp {
        proxy_pass http://127.0.0.1:8787;

        # Forward MCP-specific headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering (CRITICAL for MCP SSE protocol)
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;

        # SSE: long timeout for persistent connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # SSE: keep connection alive
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # ===== MCP Health / Messages (SSE sub-paths) =====
    location /messages {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # ===== Web UI =====
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for API calls (tool invocations)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}