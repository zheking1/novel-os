<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novel OS Console</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/alpine.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/genre.js"></script>
  <script src="js/pages/category.js"></script>
  <script src="js/pages/binding.js"></script>
  <script src="js/components/item-level.js"></script>
</head>
<body x-data="app" x-init="init()" class="bg-gray-50 min-h-screen">
  
  <!-- Sidebar -->
  <aside class="w-56 bg-white border-r fixed h-screen overflow-y-auto p-4">
    <h1 class="text-lg font-bold mb-4">Novel OS</h1>
    
    <template x-for="group in menu" :key="group.label">
      <div class="mb-4">
        <h2 class="text-xs uppercase text-gray-400 font-semibold mb-2" x-text="group.label"></h2>
        <template x-for="item in group.items" :key="item.id">
          <div @click="navigate(item.id)" 
               :class="currentPage === item.id ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-100'"
               class="px-3 py-1.5 rounded cursor-pointer text-sm select-none">
            <span x-text="item.icon"></span>
            <span x-text="item.title"></span>
          </div>
        </template>
      </div>
    </template>
  </aside>
  
  <!-- Main Content -->
  <main class="ml-56 p-6">
    <!-- Workspace / Project Selector -->
    <div class="flex gap-3 mb-4">
      <select class="border rounded px-3 py-1 text-sm" x-model="workspace" @change="loadProjects()">
        <option value="">Select Workspace</option>
        <template x-for="w in workspaces" :key="w.slug">
          <option :value="w.slug" x-text="w.name || w.slug"></option>
        </template>
      </select>
      <select class="border rounded px-3 py-1 text-sm" x-model="project">
        <option value="">Select Project</option>
        <template x-for="p in projects" :key="p.slug">
          <option :value="p.slug" x-text="p.title || p.slug"></option>
        </template>
      </select>
      <span class="text-sm text-gray-500 self-center" x-text="status"></span>
    </div>
    
    <!-- Pages -->
    <div x-show="currentPage === 'item-level'" x-data="itemLevelManager" x-init="$nextTick(() => $data.init())">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Item Levels</h2>
        <button class="bg-blue-500 text-white px-4 py-1 rounded text-sm" @click="add()">+ New</button>
      </div>
      <div class="space-y-2">
        <template x-for="(lvl, idx) in levels" :key="lvl.id">
          <div class="bg-white border rounded p-3 flex justify-between items-center">
            <div>
              <span class="font-medium" x-text="lvl.core_summary"></span>
              <span class="text-gray-400 ml-2 text-sm" x-text="lvl.detailed_expansion || ''"></span>
            </div>
            <div class="flex gap-2">
              <button class="text-blue-500 text-sm" @click="edit(idx)">Edit</button>
              <button class="text-red-500 text-sm" @click="remove(idx)">Delete</button>
            </div>
          </div>
        </template>
      </div>
      <!-- Modal -->
      <div x-show="editing !== null" class="fixed inset-0 bg-black/30 z-50" @click.self="cancel()">
        <div class="bg-white max-w-md mx-auto mt-20 p-6 rounded-lg">
          <h3 class="font-bold mb-4" x-text="editing >= 0 ? 'Edit Level' : 'New Level'"></h3>
          <input class="border rounded w-full px-3 py-2 mb-3 text-sm" x-model="form.name" placeholder="Name (e.g. Common, Rare, Epic)">
          <textarea class="border rounded w-full px-3 py-2 mb-3 text-sm" x-model="form.desc" rows="3" placeholder="Description..."></textarea>
          <div class="flex gap-3 mb-3">
            <input class="border rounded w-20 px-3 py-2 text-sm" type="number" x-model="form.order" placeholder="Order">
            <input class="border rounded flex-1 px-3 py-2 text-sm" x-model="form.range" placeholder="Range (e.g. 1-10)">
          </div>
          <div class="flex gap-2">
            <button class="bg-blue-500 text-white px-4 py-1 rounded text-sm" @click="save()">Save</button>
            <button class="border px-4 py-1 rounded text-sm" @click="cancel()">Cancel</button>
          </div>
        </div>
      </div>
    </div>
    
    <div x-show="currentPage === 'genre-manage'">
      <p class="text-gray-500" x-text="'Genre Manager - ' + (window.allGenres || []).length + ' genres'"></p>
    </div>
    
    <div x-show="currentPage === 'category-manage'">
      <p class="text-gray-500">Category Manager</p>
    </div>
    
    <div x-show="currentPage === 'binding'">
      <p class="text-gray-500">Genre-Category Binding</p>
    </div>
  </main>
  
  <!-- Toast -->
  <div class="fixed bottom-4 right-4 space-y-2 z-50">
    <template x-for="(t, idx) in toasts" :key="idx">
      <div :class="'px-4 py-2 rounded text-white text-sm ' + (t.type === 'success' ? 'bg-green-500' : t.type === 'error' ? 'bg-red-500' : 'bg-yellow-500')" 
           @click="t.list.splice(idx,1)">
        <span x-text="t.msg"></span>
      </div>
    </template>
  </div>

  <script>
    window.showToast = function(type, title, msg) {
      const app = document.querySelector('[x-data]').__x;
      const store = app.getUnobservedData();
      store.toasts.push({type, msg: title + (msg ? ': ' + msg : '')});
      setTimeout(() => store.toasts.shift(), 3000);
    };
  </script>
</body>
</html>
