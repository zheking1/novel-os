          <input id="login-password" type="password" required

                class="w-full bg-primary-600 text-white py-2 rounded-lg hover:bg-primary-700 transition-colors font-medium">
          登录

      </div>
      <div id="register-form" class="hidden mt-4 pt-4 border-t">
        <div id="register-msg" class="text-sm mb-3"></div>
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
          <input id="reg-username" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" required>
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
          <input id="reg-password" type="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" required>
        </div>

          <label class="block text-sm font-medium text-gray-700 mb-1" id="captcha-label">验证码</label>

<button onclick="handleLogout()"

  <!-- 应用初始化 -->
  <script>
    // 全局应用状态
    window.AppState = {
      initialized: false,
      currentLang: null,
      currentWorkspace: localStorage.getItem('novel-workspace') || null,
      currentProject: localStorage.getItem('novel-project') || null
    };

    // 等待所有模块加载
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('[App] Starting initialization...');
      
      // 等待模块就绪
      await waitForModules();
      
      // 检查登录状态
      try {
        const me = await fetch('/api/me').then(r => r.json());
        if (me.authenticated) {
          window.AppState.username = me.username;
          window.AppState.isAdmin = me.username === 'admin' || me.username === 'admin';
          showApp();
          await initApp();
        } else {
          showLogin();
        }
      } catch (e) {
        showLogin();
      }
    });

    let captchaId = '';
    async function loadCaptcha() {
      try {
        const r = await fetch('/api/captcha', { method: 'POST' }).then(r => r.json());
        if (r.ok) {
          captchaId = r.captcha_id;
          document.getElementById('captcha-question').textContent = r.question;
          document.getElementById('captcha-id').value = r.captcha_id;
        }
      } catch(e) { document.getElementById('captcha-question').textContent = '加载失败'; }
    }

    function toggleRegister() {
      const el = document.getElementById('register-form');
      el.classList.toggle('hidden');
      if (!el.classList.contains('hidden')) loadCaptcha();
    }

    async function handleRegister() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const answer = document.getElementById('reg-captcha').value.trim();
      const msg = document.getElementById('register-msg');
      if (!username || !password || !answer) { msg.className='text-red-500 text-sm mb-3'; msg.textContent='请填写所有字段'; return; }
      try {
        const r = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password, captcha_id: captchaId, captcha_answer: answer })
        }).then(r => r.json());
        if (r.ok) {
          msg.className = 'text-green-500 text-sm mb-3';
          msg.textContent = '注册成功！请登录';
        } else {
          msg.className = 'text-red-500 text-sm mb-3';
          msg.textContent = r.error;
          loadCaptcha();
        }
      } catch(e) { msg.className='text-red-500 text-sm mb-3'; msg.textContent = '网络错误'; }
    }

    function showLogin() {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      
      errorDiv.classList.add('hidden');
      btn.textContent = '登录中...';
      btn.disabled = true;
      
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json();
        if (data.ok) {
          window.AppState.username = data.username;
          window.AppState.isAdmin = data.username === 'admin' || data.username === 'admin';
          showApp();
          await initApp();
        } else {
          errorDiv.textContent = data.error || '登录失败';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = '网络错误: ' + err.message;
        errorDiv.classList.remove('hidden');
      } finally {
        btn.textContent = '登录';
        btn.disabled = false;
      }
    }

    async function waitForModules() {
      let retries = 0;
      while (retries < 50) {
        if (window.i18n && window.AppCore && window.ApiClient && window.MenuManager && window.NovelRouter) {
          console.log('[App] All modules ready');
          return;
        }
        await new Promise(r => setTimeout(r, 50));
        retries++;
      }
      console.error('[App] Modules failed to load');
    }

    async function initApp() {
      try {
        // 1. 初始化i18n（优先）
        console.log('[App] Initializing i18n...');
        await window.i18n.init('zh');
        window.AppState.currentLang = window.i18n.getCurrentLang();
        console.log('[App] Current language:', window.AppState.currentLang);
        
        // 2. 加载工作区
        console.log('[App] Loading workspaces...');
        const workspaces = await window.ApiClient.workspace.list({ showLoading: false });
        console.log('[App] Workspaces loaded:', workspaces?.length || 0);
        
        // 更新工作区选择器
        updateWorkspaceSelector(workspaces);
        
        // 恢复之前选择的工作区
        const savedWorkspace = localStorage.getItem('novel-workspace');
        if (savedWorkspace && workspaces.some(w => w.slug === savedWorkspace)) {
          const workspaceSelect = document.getElementById('workspace-select');
          workspaceSelect.value = savedWorkspace;
          
          // 手动加载项目（不调用handleWorkspaceChange以保留savedProject）
          window.AppState.currentWorkspace = savedWorkspace;
          const projectSelect = document.getElementById('project-select');
          projectSelect.innerHTML = `<option value="">${t('common.loading')}</option>`;
          
          try {
            const projects = await window.ApiClient.project.list(savedWorkspace, { showLoading: false });
            // Store projects list for ID lookup
            window.AppState.projectsList = projects || [];
            
            if (projects && projects.length > 0) {
              projectSelect.innerHTML = `
                <option value="">${t('project.select')}</option>
                ${projects.map(p => `<option value="${p.slug}">${p.title || p.name || p.slug}</option>`).join('')}
              `;
              
              // 恢复之前选择的项目
              const savedProject = localStorage.getItem('novel-project');
              const savedProjectData = projects.find(p => p.slug === savedProject);
              if (savedProject && savedProjectData) {
                projectSelect.value = savedProject;
                window.AppState.currentProject = savedProject;
                window.AppState.currentProjectId = savedProjectData.id;
                console.log('[App] Restored project ID:', savedProjectData.id);
              }
            } else {
              projectSelect.innerHTML = `<option value="">${t('project.none')}</option>`;
            }
          } catch (e) {
            console.error('[App] Failed to load projects:', e);
            projectSelect.innerHTML = `<option value="">${t('error.loadFailed')}</option>`;
          }
        }
        
        // 3. 渲染菜单
        console.log('[App] Rendering menu...');
        renderMenu();
        
        // 4. 更新用户状态显示
        updateUserDisplay();
        
        // 5. 更新语言切换按钮
        updateLanguageButton();
        
        // 5. 标记初始化完成
        window.AppState.initialized = true;
        
        // 6. 读取URL hash并导航到对应页面
        const hash = window.location.hash.slice(1);
        if (hash && hash !== '/') {
          const pageId = pathToPageId(hash);
          if (pageId) {
            console.log('[App] Navigating to page from hash:', pageId);
            window.MenuManager.setCurrentPage(pageId);
            navigateToPage(pageId);
            updateBreadcrumb();
          }
        } else {
          // 默认导航到首页
          window.MenuManager.setCurrentPage('home');
          navigateToPage('home');
        }
        
        console.log('[App] Initialization complete!');
        
      } catch (error) {
        console.error('[App] Initialization failed:', error);
        document.getElementById('content-area').innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-lg p-8 text-center">
            <h2 class="text-xl font-bold text-red-600 mb-2">${t('common.error')}</h2>
            <p class="text-red-500">${error.message}</p>
            <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded">${t('common.refresh')}</button>
          </div>
        `;
      }
    }

    // 使用全局t()函数渲染菜单
    function renderMenu() {
      const menu = window.MenuManager.getMenu({
        project: window.AppState.currentProject,
        t: window.t,
        isAdmin: window.AppState.isAdmin
      });
      
      const menuHtml = menu.map(section => `
        <div class="mb-1">
          <div class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-gray-100 rounded-lg transition-colors"
               onclick="MenuManager.toggleSection('${section.id}')">
            <span>${section.icon}</span>
            <span class="font-semibold text-gray-700 text-sm">${section.label}</span>
            <span class="ml-auto text-xs text-gray-400">${section.isExpanded ? '▼' : '▶'}</span>
          </div>
          ${section.isExpanded ? section.groups.map(group => `
            <div class="ml-2 mb-1">
              <div class="flex items-center gap-2 px-3 py-1.5 cursor-pointer hover:bg-gray-50 rounded transition-colors"
                   onclick="MenuManager.toggleGroup('${group.id}')">
                <span class="text-xs">${group.icon}</span>
                <span class="text-xs font-medium text-gray-500">${group.label}</span>
                <span class="ml-auto text-xs text-gray-300">${group.isExpanded ? '▾' : '▸'}</span>
              </div>
              ${group.isExpanded ? group.items.map(item => `
                <a href="#${item.path}"
                   class="flex items-center gap-2 pl-8 pr-3 py-1.5 rounded text-sm transition-colors ${item.isActive ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50'}"
                   onclick="handleMenuClick('${item.id}', '${item.path}')">
                  <span class="text-xs">${item.icon}</span>
                  <span>${item.label}</span>
                </a>
              `).join('') : ''}
            </div>
          `).join('') : ''}
        </div>
      `).join('');
      
      document.getElementById('main-menu').innerHTML = menuHtml;
      document.querySelector('title').textContent = t('app.name');
    }

    function updateWorkspaceSelector(workspaces) {
      const wsSelect = document.getElementById('workspace-select');
      if (workspaces && workspaces.length > 0) {
        wsSelect.innerHTML = `
          <option value="">${t('workspace.select')}</option>
          ${workspaces.map(w => `<option value="${w.slug}">${w.name || w.slug}</option>`).join('')}
        `;
      } else {
        wsSelect.innerHTML = `<option value="">${t('workspace.select')}</option>`;
      }
    }

    async function handleWorkspaceChange(workspaceSlug) {
      console.log('[App] Workspace changed:', workspaceSlug);
      window.AppState.currentWorkspace = workspaceSlug;
      window.AppState.currentProject = null;
      localStorage.setItem('novel-workspace', workspaceSlug || '');
      localStorage.removeItem('novel-project');
      
      // 清空项目选择器
      const projectSelect = document.getElementById('project-select');
      projectSelect.innerHTML = `<option value="">${t('common.loading')}</option>`;
      
      if (!workspaceSlug) {
        projectSelect.innerHTML = `<option value="">${t('project.select')}</option>`;
        return;
      }
      
      try {
        const projects = await window.ApiClient.project.list(workspaceSlug, { showLoading: false });
        console.log('[App] Projects loaded:', projects?.length || 0);
        
        // Store projects list for ID lookup
        window.AppState.projectsList = projects || [];
        
        if (projects && projects.length > 0) {
          projectSelect.innerHTML = `
            <option value="">${t('project.select')}</option>
            ${projects.map(p => `<option value="${p.slug}" data-id="${p.id || ''}">${p.title || p.name || p.slug}</option>`).join('')}
          `;
        } else {
          projectSelect.innerHTML = `<option value="">${t('project.none')}</option>`;
        }
      } catch (error) {
        console.error('[App] Failed to load projects:', error);
        projectSelect.innerHTML = `<option value="">${t('error.loadFailed')}</option>`;
      }
      
      // 重新渲染菜单（可能需要显示/隐藏需要项目的菜单项）
      renderMenu();
    }

    function handleProjectChange(projectSlug) {
      console.log('[App] Project changed:', projectSlug);
      window.AppState.currentProject = projectSlug;
      
      // Look up project ID from stored projects list
      const project = window.AppState.projectsList?.find(p => p.slug === projectSlug);
      window.AppState.currentProjectId = project?.id || null;
      console.log('[App] Project ID:', window.AppState.currentProjectId);
      
      localStorage.setItem('novel-project', projectSlug || '');
      
      // 重新渲染菜单
      renderMenu();
      
      // 如果当前有打开的页面，重新加载
      const currentPage = window.MenuManager.state.currentPage;
      if (currentPage) {
        navigateToPage(currentPage);
      }
    }

    function updateLanguageButton() {
      const langBtn = document.getElementById('lang-toggle');
      if (langBtn) {
        const currentLang = window.i18n.getCurrentLang();
        langBtn.textContent = currentLang === 'zh' ? '中文' : 'EN';
        langBtn.title = currentLang === 'zh' ? 'Switch to English' : '切换到中文';
      }
    }

    function updateUserDisplay() {
      const username = window.AppState.username;
      if (!username) return;
      
      const userNameEl = document.getElementById('user-name');
      const userAvatarEl = document.getElementById('user-avatar');
      const userRoleEl = document.getElementById('user-role');
      
      if (userNameEl) userNameEl.textContent = username;
      if (userAvatarEl) userAvatarEl.textContent = username.charAt(0).toUpperCase();
      if (userRoleEl) userRoleEl.textContent = window.AppState.isAdmin ? '管理员' : '用户';
    }

    async function handleLogout() {
      if (!confirm('确定要退出登录吗？')) return;
      
      try {
        await fetch('/api/logout', { method: 'POST' });
      } catch (e) {
        console.error('[App] Logout error:', e);
      }
      
      // 清除本地状态
      window.AppState.username = null;
      window.AppState.isAdmin = false;
      localStorage.removeItem('novel-workspace');
      localStorage.removeItem('novel-project');
      
      // 显示登录页面
      showLogin();
    }

    async function toggleLanguage() {
      const currentLang = window.i18n.getCurrentLang();
      const newLang = currentLang === 'zh' ? 'en' : 'zh';

      window.AppState.currentLang = newLang;

      // 更新面包屑

    function updateBreadcrumb() {
      const currentPage = window.MenuManager.state.currentPage;
      const pageInfo = window.MenuManager.getPageInfo(currentPage);
      
      if (pageInfo) {
        const breadcrumb = document.getElementById('breadcrumb');
        breadcrumb.innerHTML = `
          <a href="/" class="hover:text-primary-600">${t('nav.home')}</a>
          <span class="mx-2">/</span>
          <span class="text-gray-500">${t(pageInfo.sectionLabel)}</span>
          <span class="mx-2">/</span>
          <span class="text-gray-500">${t(pageInfo.groupLabel)}</span>
          <span class="mx-2">/</span>
          <span class="text-gray-800">${t(pageInfo.labelKey)}</span>
        `;
      }
    }

    // 路径 -> 页面ID 映射
    function pathToPageId(path) {
      if (!path) return null;
      const menu = window.MenuManager.getMenu({ project: window.AppState?.currentProject, t: window.t, isAdmin: window.AppState?.isAdmin });
      for (const section of menu) {
        for (const group of section.groups) {
          for (const item of group.items) {
            if (item.path === path) return item.id;
          }
        }
      }
      return null;
    }

    function handleMenuClick(pageId, path) {
      console.log('[Menu] Clicked:', pageId, path);
      window.MenuManager.setCurrentPage(pageId);
      updateBreadcrumb();
      
      // 更新URL hash（不触发hashchange）
      if (path && window.location.hash !== '#' + path) {
        history.pushState(null, '', '#' + path);
      }
      
      // 路由到对应页面
      navigateToPage(pageId);
    }

    async function testApi() {

    }

    // 显示/隐藏加载遮罩
    window.addEventListener('app:loading', (e) => {
      const mask = document.getElementById('loading-mask');
      if (e.detail.loading) {
        mask.classList.remove('hidden');
      } else {
        mask.classList.add('hidden');
      }
    });

    // 监听浏览器前进/后退
    window.addEventListener('popstate', () => {
      if (!window.AppState?.initialized) return;
      const hash = window.location.hash.slice(1);
      if (hash && hash !== '/') {
        const pageId = pathToPageId(hash);
        if (pageId) {
          window.MenuManager.setCurrentPage(pageId);
          navigateToPage(pageId);
          updateBreadcrumb();
        }
      }
    });

    // 监听菜单变更事件
    window.addEventListener('menu:changed', () => {
      renderMenu();
    });

    // 监听语言变更事件
    window.addEventListener('i18n:changed', (e) => {
      renderMenu();
      updateLanguageButton();
      updateBreadcrumb();
      
      // 更新当前语言显示
      const langDisplay = document.getElementById('current-lang');
      if (langDisplay) {
        langDisplay.textContent = e.detail.lang === 'zh' ? '中文' : 'English';
      }
    });
    
    // 初始化完成后的更新
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const langDisplay = document.getElementById('current-lang');
        if (langDisplay && window.i18n) {
          langDisplay.textContent = window.i18n.getCurrentLang() === 'zh' ? '中文' : 'English';
        }
      }, 1000);
    });
