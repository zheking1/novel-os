<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Novel OS</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    .fade-enter { opacity: 0; transform: translateY(10px); }
    .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.3s ease; }
  </style>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- 登录界面 -->
  <div id="login-screen" class="hidden min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-primary-600 rounded-xl flex items-center justify-center text-white font-bold text-xl mx-auto">N</div>
        <h1 class="mt-3 text-xl font-bold text-gray-800">Novel OS</h1>
        <p class="text-sm text-gray-500 mt-1">请登录以继续</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
          <input id="login-username" type="text" required autofocus
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none"
                 placeholder="admin">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
          <input id="login-password" type="password" required
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none"
                 placeholder="密码">
        </div>
        <div id="login-error" class="hidden text-red-500 text-sm mb-3"></div>
        <button type="submit" id="login-btn"
                class="w-full bg-primary-600 text-white py-2 rounded-lg hover:bg-primary-700 transition-colors font-medium">
          登录
        </button>
      </form>
    </div>
  </div>

  <!-- 应用容器 -->
  <div id="app" class="min-h-screen flex hidden">
    
    <!-- 侧边栏 -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full">
      <!-- Logo -->
      <div class="h-16 flex items-center px-4 border-b border-gray-200">
        <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center text-white font-bold">N</div>
        <span class="ml-2 font-semibold text-lg">Novel OS</span>
      </div>
      
      <!-- 菜单 -->
      <nav class="flex-1 overflow-y-auto p-3" id="main-menu">
        <!-- 动态生成菜单 -->
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 ml-64 flex flex-col min-h-screen">
      <!-- 顶部栏 -->
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-30">
        <div class="flex items-center gap-2 text-sm text-gray-500">
          <span id="breadcrumb">
            <a href="/" class="hover:text-primary-600">首页</a>
          </span>
        </div>
        
        <div class="flex items-center gap-4">
          <select id="workspace-select" onchange="handleWorkspaceChange(this.value)" class="text-sm border border-gray-300 rounded px-3 py-1.5">
            <option value="">加载中...</option>
          </select>
          <select id="project-select" onchange="handleProjectChange(this.value)" class="text-sm border border-gray-300 rounded px-3 py-1.5">
            <option value="">选择项目</option>
          </select>
          
          <!-- 语言切换按钮 -->
          <button id="lang-toggle" onclick="toggleLanguage()" 
                  class="px-3 py-1.5 text-sm border border-gray-300 rounded hover:bg-gray-100 transition-colors"
                  title="Switch to English">
            中文
          </button>
        </div>
      </header>

      <!-- 内容区域 -->
      <div id="content-area" class="flex-1 p-6">
        <div class="bg-white rounded-lg shadow p-8 text-center">
          <h1 class="text-2xl font-bold text-gray-800 mb-4">欢迎使用 Novel OS</h1>
          <p class="text-gray-600">基础框架已搭建完成</p>
          <div class="mt-6 space-x-4">
            <button onclick="testApi()" class="px-4 py-2 bg-primary-600 text-white rounded hover:bg-primary-700">
              测试API
            </button>
            <button onclick="showMenuInfo()" class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">
              显示菜单信息
            </button>
          </div>
          <div class="mt-6 pt-6 border-t border-gray-200">
            <p class="text-sm text-gray-500">当前语言: <span id="current-lang" class="font-medium">中文</span></p>
            <p class="text-sm text-gray-500 mt-1">点击右上角按钮切换语言</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 加载遮罩 -->
  <div id="loading-mask" class="fixed inset-0 bg-white/80 z-50 flex items-center justify-center hidden">
    <div class="text-center">
      <div class="spinner w-10 h-10 border-4 border-primary-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
      <p class="mt-2 text-gray-600">加载中...</p>
    </div>
  </div>

  <!-- 核心模块 - 按顺序加载 -->
  <script src="js/core/i18n.js?v=1"></script>
  <script src="js/core/app-core.js?v=1"></script>
  <script src="js/core/api-client.js?v=1"></script>
  <script src="js/core/menu-manager.js?v=1"></script>
  <script src="js/core/router.js?v=1"></script>
  
  <!-- 组件 -->
  <script src="js/components/data-table.js?v=1"></script>
  <script src="js/components/modal-dialog.js?v=1"></script>
  
  <!-- 页面 -->
  <script src="js/pages/project-manage-page.js?v=1"></script>
  <script src="js/pages/level-manager.js?v=1"></script>
  <script src="js/pages/genre-manager.js?v=1"></script>
  <script src="js/pages/category-manager.js?v=1"></script>
  <script src="js/pages/binding-matrix-manager.js?v=1"></script>
  <script src="js/pages/health-page.js?v=1"></script>
  <script src="js/pages/canon-list-page.js?v=1"></script>
  <script src="js/pages/entities-list-page.js?v=1"></script>
  <script src="js/pages/rules-list-page.js?v=1"></script>
  <script src="js/pages/plot-volumes-page.js?v=1"></script>
  <script src="js/pages/plot-threads-page.js?v=1"></script>
  <script src="js/pages/foreshadowing-list-page.js?v=1"></script>
  <script src="js/pages/context-preview-page.js?v=1"></script>
  <script src="js/pages/review-tasks-page.js?v=1"></script>
  <script src="js/pages/pipeline-page.js?v=1"></script>
  <script src="js/pages/chapters-page.js?v=1"></script>
  <script src="js/pages/project-world-rules-page.js?v=1"></script>
  <script src="js/pages/project-characters-page.js?v=1"></script>
  <script src="js/pages/project-factions-page.js?v=1"></script>
  <script src="js/pages/project-world-state-page.js?v=1"></script>
  <script src="js/pages/model-profiles-page.js?v=1"></script>

  <!-- 应用初始化 -->
  <script>
    // 全局应用状态
    window.AppState = {
      initialized: false,
      currentLang: null,
      currentWorkspace: null,
      currentProject: null
    };

    // 等待所有模块加载
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('[App] Starting initialization...');
      
      // 等待模块就绪
      await waitForModules();
      
      // 检查登录状态
      try {
        const me = await fetch('/api/me').then(r => r.json());
        if (me.authenticated) {
          window.AppState.username = me.username;
          showApp();
          await initApp();
        } else {
          showLogin();
        }
      } catch (e) {
        showLogin();
      }
    });

    function showLogin() {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      
      errorDiv.classList.add('hidden');
      btn.textContent = '登录中...';
      btn.disabled = true;
      
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json();
        if (data.ok) {
          window.AppState.username = data.username;
          showApp();
          await initApp();
        } else {
          errorDiv.textContent = data.error || '登录失败';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = '网络错误: ' + err.message;
        errorDiv.classList.remove('hidden');
      } finally {
        btn.textContent = '登录';
        btn.disabled = false;
      }
    }

    async function waitForModules() {
      let retries = 0;
      while (retries < 50) {
        if (window.i18n && window.AppCore && window.ApiClient && window.MenuManager && window.NovelRouter) {
          console.log('[App] All modules ready');
          return;
        }
        await new Promise(r => setTimeout(r, 50));
        retries++;
      }
      console.error('[App] Modules failed to load');
    }

    async function initApp() {
      try {
        // 1. 初始化i18n（优先）
        console.log('[App] Initializing i18n...');
        await window.i18n.init('zh');
        window.AppState.currentLang = window.i18n.getCurrentLang();
        console.log('[App] Current language:', window.AppState.currentLang);
        
        // 2. 加载工作区
        console.log('[App] Loading workspaces...');
        const workspaces = await window.ApiClient.workspace.list({ showLoading: false });
        console.log('[App] Workspaces loaded:', workspaces?.length || 0);
        
        // 更新工作区选择器
        updateWorkspaceSelector(workspaces);
        
        // 3. 渲染菜单
        console.log('[App] Rendering menu...');
        renderMenu();
        
        // 4. 更新语言切换按钮
        updateLanguageButton();
        
        // 5. 标记初始化完成
        window.AppState.initialized = true;
        
        console.log('[App] Initialization complete!');
        
      } catch (error) {
        console.error('[App] Initialization failed:', error);
        document.getElementById('content-area').innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-lg p-8 text-center">
            <h2 class="text-xl font-bold text-red-600 mb-2">${t('common.error')}</h2>
            <p class="text-red-500">${error.message}</p>
            <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded">${t('common.refresh')}</button>
          </div>
        `;
      }
    }

    // 使用全局t()函数渲染菜单
    function renderMenu() {
      const menu = window.MenuManager.getMenu({
        project: window.AppState.currentProject,
        t: window.t
      });
      
      const menuHtml = menu.map(section => `
        <div class="mb-1">
          <div class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-gray-100 rounded-lg transition-colors"
               onclick="MenuManager.toggleSection('${section.id}')">
            <span>${section.icon}</span>
            <span class="font-semibold text-gray-700 text-sm">${section.label}</span>
            <span class="ml-auto text-xs text-gray-400">${section.isExpanded ? '▼' : '▶'}</span>
          </div>
          ${section.isExpanded ? section.groups.map(group => `
            <div class="ml-2 mb-1">
              <div class="flex items-center gap-2 px-3 py-1.5 cursor-pointer hover:bg-gray-50 rounded transition-colors"
                   onclick="MenuManager.toggleGroup('${group.id}')">
                <span class="text-xs">${group.icon}</span>
                <span class="text-xs font-medium text-gray-500">${group.label}</span>
                <span class="ml-auto text-xs text-gray-300">${group.isExpanded ? '▾' : '▸'}</span>
              </div>
              ${group.isExpanded ? group.items.map(item => `
                <a href="#${item.path}"
                   class="flex items-center gap-2 pl-8 pr-3 py-1.5 rounded text-sm transition-colors ${item.isActive ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50'}"
                   onclick="handleMenuClick('${item.id}', '${item.path}')">
                  <span class="text-xs">${item.icon}</span>
                  <span>${item.label}</span>
                </a>
              `).join('') : ''}
            </div>
          `).join('') : ''}
        </div>
      `).join('');
      
      document.getElementById('main-menu').innerHTML = menuHtml;
      document.querySelector('title').textContent = t('app.name');
    }

    function updateWorkspaceSelector(workspaces) {
      const wsSelect = document.getElementById('workspace-select');
      if (workspaces && workspaces.length > 0) {
        wsSelect.innerHTML = `
          <option value="">${t('workspace.select')}</option>
          ${workspaces.map(w => `<option value="${w.slug}">${w.name || w.slug}</option>`).join('')}
        `;
      } else {
        wsSelect.innerHTML = `<option value="">${t('workspace.select')}</option>`;
      }
    }

    async function handleWorkspaceChange(workspaceSlug) {
      console.log('[App] Workspace changed:', workspaceSlug);
      window.AppState.currentWorkspace = workspaceSlug;
      window.AppState.currentProject = null;
      
      // 清空项目选择器
      const projectSelect = document.getElementById('project-select');
      projectSelect.innerHTML = `<option value="">${t('common.loading')}</option>`;
      
      if (!workspaceSlug) {
        projectSelect.innerHTML = `<option value="">${t('project.select')}</option>`;
        return;
      }
      
      try {
        const projects = await window.ApiClient.project.list(workspaceSlug, { showLoading: false });
        console.log('[App] Projects loaded:', projects?.length || 0);
        
        if (projects && projects.length > 0) {
          projectSelect.innerHTML = `
            <option value="">${t('project.select')}</option>
            ${projects.map(p => `<option value="${p.slug}">${p.title || p.name || p.slug}</option>`).join('')}
          `;
        } else {
          projectSelect.innerHTML = `<option value="">${t('project.none')}</option>`;
        }
      } catch (error) {
        console.error('[App] Failed to load projects:', error);
        projectSelect.innerHTML = `<option value="">${t('error.loadFailed')}</option>`;
      }
      
      // 重新渲染菜单（可能需要显示/隐藏需要项目的菜单项）
      renderMenu();
    }

    function handleProjectChange(projectSlug) {
      console.log('[App] Project changed:', projectSlug);
      window.AppState.currentProject = projectSlug;
      
      // 重新渲染菜单
      renderMenu();
      
      // 如果当前有打开的页面，重新加载
      const currentPage = window.MenuManager.state.currentPage;
      if (currentPage) {
        navigateToPage(currentPage);
      }
    }

    function updateLanguageButton() {
      const langBtn = document.getElementById('lang-toggle');
      if (langBtn) {
        const currentLang = window.i18n.getCurrentLang();
        const otherLang = currentLang === 'zh' ? 'en' : 'zh';
        langBtn.textContent = currentLang === 'zh' ? '中文' : 'EN';
        langBtn.title = currentLang === 'zh' ? 'Switch to English' : '切换到中文';
      }
    }

    async function toggleLanguage() {
      const currentLang = window.i18n.getCurrentLang();
      const newLang = currentLang === 'zh' ? 'en' : 'zh';
      
      await window.i18n.setLang(newLang);
      window.AppState.currentLang = newLang;
      
      // 重新渲染菜单
      renderMenu();
      
      // 更新语言按钮
      updateLanguageButton();
      
      // 更新面包屑
      updateBreadcrumb();
      
      console.log('[App] Language switched to:', newLang);
    }

    function updateBreadcrumb() {
      const currentPage = window.MenuManager.state.currentPage;
      const pageInfo = window.MenuManager.getPageInfo(currentPage);
      
      if (pageInfo) {
        const breadcrumb = document.getElementById('breadcrumb');
        breadcrumb.innerHTML = `
          <a href="/" class="hover:text-primary-600">${t('nav.home')}</a>
          <span class="mx-2">/</span>
          <span class="text-gray-500">${t(pageInfo.sectionLabel)}</span>
          <span class="mx-2">/</span>
          <span class="text-gray-500">${t(pageInfo.groupLabel)}</span>
          <span class="mx-2">/</span>
          <span class="text-gray-800">${t(pageInfo.labelKey)}</span>
        `;
      }
    }

    function handleMenuClick(pageId, path) {
      console.log('[Menu] Clicked:', pageId, path);
      window.MenuManager.setCurrentPage(pageId);
      updateBreadcrumb();
      
      // 路由到对应页面
      navigateToPage(pageId);
    }

    function navigateToPage(pageId) {
      const contentArea = document.getElementById('content-area');
      
      switch (pageId) {
        // ===== 项目管理 =====
        case 'project-manage':
          window.ProjectManagePage?.init() || showPlaceholder(t('nav.projectManage'));
          break;
        // ===== 项目管理 - 设定 =====
        case 'canon-list':
          window.CanonListPage?.init() || showPlaceholder(t('nav.canonList'));
          break;
        case 'entities-list':
          window.EntitiesListPage?.init() || showPlaceholder(t('nav.entityList'));
          break;
        case 'rules-list':
          window.RulesListPage?.init() || showPlaceholder(t('nav.rulesList'));
          break;
        case 'graph-view':
          window.GraphViewPage?.init() || showPlaceholder(t('nav.graphView'));
          break;
          
        // ===== 项目管理 - 剧情 =====
        case 'plot-volumes':
          window.PlotVolumesPage?.init() || showPlaceholder(t('nav.volumes'));
          break;
        case 'plot-threads':
          window.PlotThreadsPage?.init() || showPlaceholder(t('nav.threads'));
          break;
        case 'foreshadowing-list':
          window.ForeshadowingListPage?.init() || showPlaceholder(t('nav.foreshadowList'));
          break;
          
        // ===== 项目管理 - 生成 =====
        case 'context-preview':
          window.ContextPreviewPage?.init() || showPlaceholder(t('nav.contextPreview'));
          break;
        case 'review-tasks':
          window.ReviewTasksPage?.init() || showPlaceholder(t('nav.reviewTasks'));
          break;
        case 'compliance':
          window.CompliancePage?.init() || showPlaceholder(t('nav.compliance'));
          break;
        case 'pipeline':
          window.PipelinePage?.init() || showPlaceholder(t('nav.pipeline'));
          break;
        case 'chapters':
          window.ChaptersPage?.init() || showPlaceholder(t('nav.chapters'));
          break;
          
        // ===== 项目管理 - 项目知识 =====
        case 'project-world-rules':
          window.ProjectWorldRulesPage?.init() || showPlaceholder(t('nav.worldRules'));
          break;
        case 'project-characters':
          window.ProjectCharactersPage?.init() || showPlaceholder(t('nav.characters'));
          break;
        case 'project-factions':
          window.ProjectFactionsPage?.init() || showPlaceholder(t('nav.factions'));
          break;
        case 'project-world-state':
          window.ProjectWorldStatePage?.init() || showPlaceholder(t('nav.worldState'));
          break;
          
        // ===== 项目管理 - 本地 =====
        case 'knowledge-pack':
          window.KnowledgePackPage?.init() || showPlaceholder(t('nav.knowledgePack'));
          break;
        case 'local-projects':
          window.LocalProjectsPage?.init() || showPlaceholder(t('nav.localProjects'));
          break;
        case 'local-chapters':
          window.LocalChaptersPage?.init() || showPlaceholder(t('nav.localChapters'));
          break;
        case 'local-pipeline':
          window.LocalPipelinePage?.init() || showPlaceholder(t('nav.localPipeline'));
          break;
          
        // ===== 知识库 =====
        case 'uk-manage':
          window.UkManagePage?.init() || showPlaceholder(t('nav.ukManage'));
          break;
        case 'auto-search':
          window.AutoSearchPage?.init() || showPlaceholder(t('nav.autoSearch'));
          break;
        case 'knowledge-graph':
          window.KnowledgeGraphPage?.init() || showPlaceholder(t('nav.knowledgeGraph'));
          break;
        case 'knowledge-stats':
          window.KnowledgeStatsPage?.init() || showPlaceholder(t('nav.knowledgeStats'));
          break;
        case 'genre-manage':
          window.GenreManager.init();
          break;
        case 'category-manage':
          window.CategoryManager.init();
          break;
        case 'binding-matrix':
          window.BindingMatrixManager.init();
          break;
        case 'knowledge-review':
          window.KnowledgeReviewPage?.init() || showPlaceholder(t('nav.knowledgeReview'));
          break;
        case 'knowledge-expiry':
          window.KnowledgeExpiryPage?.init() || showPlaceholder(t('nav.knowledgeExpiry'));
          break;
          
        // ===== 系统管理 =====
        case 'model-profiles':
          window.ModelProfilesPage?.init() || showPlaceholder(t('nav.modelProfiles'));
          break;
        case 'model-cost':
          window.ModelCostPage?.init() || showPlaceholder(t('nav.costReport'));
          break;
        case 'template-list':
          window.TemplateListPage?.init() || showPlaceholder(t('nav.templateList'));
          break;
        case 'market-browse':
          window.MarketBrowsePage?.init() || showPlaceholder(t('nav.marketBrowse'));
          break;
        case 'skill-manage':
          window.SkillManagePage?.init() || showPlaceholder(t('nav.skillManage'));
          break;
        case 'sync-status':
          window.SyncStatusPage?.init() || showPlaceholder(t('nav.syncStatus'));
          break;
        case 'sync-conflicts':
          window.SyncConflictsPage?.init() || showPlaceholder(t('nav.syncConflicts'));
          break;
        case 'audit-logs':
          window.AuditLogsPage?.init() || showPlaceholder(t('nav.auditLogs'));
          break;
        case 'offline-status':
          window.OfflineStatusPage?.init() || showPlaceholder(t('nav.offlineStatus'));
          break;
        case 'sys-health':
          window.HealthPage.init();
          break;
        case 'sys-cache':
          window.SysCachePage?.init() || showPlaceholder(t('nav.sysCache'));
          break;
        case 'sys-backup':
          window.SysBackupPage?.init() || showPlaceholder(t('nav.sysBackup'));
          break;
        case 'system-connection':
          window.ConnectionPage?.init() || showPlaceholder(t('nav.connection'));
          break;
        case 'system-account':
          window.AccountPage?.init() || showPlaceholder(t('nav.account'));
          break;
        case 'system-users':
          window.UsersPage?.init() || showPlaceholder(t('nav.users'));
          break;
        case 'system-debug':
          window.DebugPage?.init() || showPlaceholder(t('nav.debug'));
          break;
          
        default:
          showPlaceholder(t('nav.home'));
      }
    }

    function showPlaceholder(title) {
      const contentArea = document.getElementById('content-area');
      contentArea.innerHTML = `
        <div class="bg-white rounded-lg shadow p-8 text-center">
          <div class="text-4xl mb-4">🚧</div>
          <h1 class="text-2xl font-bold text-gray-800 mb-2">${title}</h1>
          <p class="text-gray-500">此页面正在开发中...</p>
        </div>
      `;
    }

    async function testApi() {
      try {
        window.AppCore.setLoading(true);
        const result = await window.ApiClient.workspace.list();
        alert(t('common.success') + '!\n' + t('workspace.select') + ': ' + (result?.length || 0));
      } catch (error) {
        alert(t('common.error') + ': ' + error.message);
      } finally {
        window.AppCore.setLoading(false);
      }
    }

    function showMenuInfo() {
      const info = window.MenuManager.getMenu({ t: window.t });
      console.log('Menu info:', info);
      console.log('Current translations:', window.i18n.messages[window.i18n.currentLang]);
    }

    // 显示/隐藏加载遮罩
    window.addEventListener('app:loading', (e) => {
      const mask = document.getElementById('loading-mask');
      if (e.detail.loading) {
        mask.classList.remove('hidden');
      } else {
        mask.classList.add('hidden');
      }
    });

    // 监听菜单变更事件
    window.addEventListener('menu:changed', () => {
      renderMenu();
    });

    // 监听语言变更事件
    window.addEventListener('i18n:changed', (e) => {
      renderMenu();
      updateLanguageButton();
      updateBreadcrumb();
      
      // 更新当前语言显示
      const langDisplay = document.getElementById('current-lang');
      if (langDisplay) {
        langDisplay.textContent = e.detail.lang === 'zh' ? '中文' : 'English';
      }
    });
    
    // 初始化完成后的更新
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const langDisplay = document.getElementById('current-lang');
        if (langDisplay && window.i18n) {
          langDisplay.textContent = window.i18n.getCurrentLang() === 'zh' ? '中文' : 'English';
        }
      }, 1000);
    });
  </script>

</body>
</html>
