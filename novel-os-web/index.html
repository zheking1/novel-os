<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Novel OS - 智能小说创作平台</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a1a1a1;
    }

    /* Animations */
    .fade-enter {
      opacity: 0;
      transform: translateY(10px);
    }
    .fade-enter-active {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .fade-exit {
      opacity: 1;
      transform: translateY(0);
    }
    .fade-exit-active {
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* Loading spinner */
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <!-- App Container -->
  <div id="app" x-data="appShell" x-init="init()" class="min-h-screen flex">

    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 h-full bg-white border-r border-gray-200 z-40 transition-all duration-300"
           :class="sidebarCollapsed ? 'w-16' : 'w-64'">

      <!-- Logo -->
      <div class="h-16 flex items-center border-b border-gray-200 px-4"
           :class="sidebarCollapsed ? 'justify-center' : 'justify-between'">
        <template x-if="!sidebarCollapsed">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">N</div>
            <span class="font-semibold text-lg">Novel OS</span>
          </div>
        </template>
        <template x-if="sidebarCollapsed">
          <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">N</div>
        </template>
        <button @click="sidebarCollapsed = !sidebarCollapsed"
                class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors"
                :class="sidebarCollapsed && 'hidden'">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
          </svg>
        </button>
      </div>

      <!-- Menu -->
      <nav class="p-2 space-y-1 overflow-y-auto" style="height: calc(100% - 64px)">
        <template x-for="group in menuGroups" :key="group.id">
          <div class="mb-2">
            <!-- Group Header -->
            <button @click="group.collapsed = !group.collapsed"
                    class="w-full flex items-center gap-2 px-3 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wider rounded-lg hover:bg-gray-100 transition-colors"
                    :class="sidebarCollapsed && 'justify-center'"
                    x-show="!sidebarCollapsed">
              <span x-text="group.icon" class="text-base"></span>
              <span x-show="!sidebarCollapsed" x-text="t(group.labelKey) || group.label" class="flex-1 text-left"></span>
              <svg x-show="!sidebarCollapsed" class="w-4 h-4 transition-transform" :class="group.collapsed ? '' : 'rotate-90'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
            </button>

            <!-- Group Items -->
            <div x-show="!group.collapsed || sidebarCollapsed"
                 x-collapse
                 class="space-y-0.5 mt-1"
                 :class="sidebarCollapsed && 'mt-2'">
              <template x-for="item in group.items" :key="item.id">
                <a href="#"
                   @click.prevent="navigate(item.id)"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg transition-colors text-sm"
                   :class="[
                     currentPage === item.id
                       ? 'bg-primary-50 text-primary-700 font-medium'
                       : 'text-gray-600 hover:bg-gray-100',
                     sidebarCollapsed ? 'justify-center' : ''
                   ]"
                   :title="sidebarCollapsed ? (t(item.titleKey) || item.title) : ''">
                  <span x-text="item.icon" class="text-lg"></span>
                  <span x-show="!sidebarCollapsed" x-text="t(item.titleKey) || item.title" class="flex-1"></span>
                  <span x-show="!sidebarCollapsed && item.requiresProject && !project"
                        class="text-xs text-orange-500 ml-auto">!</span>
                </a>
              </template>
            </div>
          </div>
        </template>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-h-screen transition-all duration-300"
          :class="sidebarCollapsed ? 'ml-16' : 'ml-64'">

      <!-- Header -->
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-30">
        <div class="flex items-center gap-4">
          <!-- Breadcrumb -->
          <nav class="flex items-center gap-2 text-sm">
            <template x-for="(crumb, index) in breadcrumbs" :key="index">
              <div class="flex items-center gap-2">
                <span x-if="index > 0" class="text-gray-400">/</span>
                <a x-if="crumb.page" @click.prevent="navigate(crumb.page)" href="#"
                   class="text-primary-600 hover:text-primary-800 transition-colors"
                   x-text="crumb.label"></a>
                <span x-if="!crumb.page" class="text-gray-500" x-text="crumb.label"></span>
              </div>
            </template>
          </nav>
        </div>

        <div class="flex items-center gap-4">
          <!-- Workspace Selector -->
          <div class="flex items-center gap-2">
            <select x-model="workspace" @change="changeWorkspace($event.target.value)"
                    class="text-sm border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
              <option value="" disabled>选择工作区</option>
              <template x-for="w in workspaces" :key="w.slug">
                <option :value="w.slug" x-text="w.name || w.slug"></option>
              </template>
            </select>

            <!-- Project Selector -->
            <select x-model="project" @change="changeProject($event.target.value)"
                    class="text-sm border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
              <option value="">选择项目</option>
              <template x-for="p in projects" :key="p.slug">
                <option :value="p.slug" x-text="p.title || p.slug"></option>
              </template>
            </select>
          </div>

          <!-- Language Toggle -->
          <button @click="toggleLang()"
                  class="p-2 rounded-lg hover:bg-gray-100 transition-colors text-sm font-medium text-gray-600">
            <span x-text="currentLang === 'zh' ? 'EN' : '中文'"></span>
          </button>

          <!-- User Menu -->
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="w-8 h-8 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center font-semibold">
              U
            </button>
            <div x-show="open" @click.away="open = false" x-collapse class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">个人设置</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">系统信息</a>
              <div class="border-t border-gray-200 my-1"></div>
              <a href="#" @click.prevent="logout()" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">退出登录</a>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="flex-1 p-6 overflow-auto">

        <!-- Loading Overlay -->
        <div x-show="loading" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex items-center justify-center"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
          <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <p class="text-gray-600" x-text="loadingMessage || '加载中...'"></p>
          </div>
        </div>

        <!-- Page: Item Level Management -->
        <div x-show="currentPage === 'level-item'" x-data="itemLevelManager" x-init="init()" x-cloak>
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900" x-text="t('level.item.title')"></h1>
            <p class="text-gray-600 mt-1" x-text="t('level.item.description')"></p>
          </div>

          <!-- Toolbar -->
          <div class="flex justify-between items-center mb-4">
            <div class="flex gap-2">
              <button @click="add()"
                      class="inline-flex items-center gap-2 px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span x-text="t('level.new')"></span>
              </button>
            </div>
          </div>

          <!-- Table -->
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('level.name')"></th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('level.desc')"></th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('level.order')"></th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('level.range')"></th>
                  <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('common.actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                <template x-for="(level, index) in levels" :key="level.id">
                  <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap">
                      <span class="font-medium text-gray-900" x-text="level.core_summary || level.name"></span>
                    </td>
                    <td class="px-6 py-4">
                      <span class="text-gray-600 text-sm" x-text="level.detailed_expansion || level.data?.description || '-'"></span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                      <span class="text-gray-600" x-text="level.sort_order || index + 1"></span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                      <span class="text-gray-600" x-text="level.data?.numeric_range || '-'"></span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right">
                      <button @click="edit(index)" class="text-primary-600 hover:text-primary-800 mr-3" x-text="t('level.edit')"></button>
                      <button @click="remove(index)" class="text-red-600 hover:text-red-800" x-text="t('level.delete')"></button>
                    </td>
                  </tr>
                </template>
                <tr x-show="levels.length === 0">
                  <td colspan="5" class="px-6 py-12 text-center text-gray-500" x-text="t('level.empty')"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Modal -->
          <div x-show="editing !== null" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="opacity-0"
               x-transition:enter-end="opacity-100"
               x-transition:leave="transition ease-in duration-150"
               x-transition:leave-start="opacity-100"
               x-transition:leave-end="opacity-0"
               @click.self="cancel()">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95">
              <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900" x-text="editing >= 0 ? t('level.edit') : t('level.new')"></h3>
              </div>
              <div class="p-6 space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('level.name')"></label>
                  <input type="text" x-model="form.name"
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                         :placeholder="t('level.name')">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('level.desc')"></label>
                  <textarea x-model="form.desc" rows="3"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                            :placeholder="t('level.desc')"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('level.order')"></label>
                    <input type="number" x-model.number="form.order"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('level.range')"></label>
                    <input type="text" x-model="form.range"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                           placeholder="e.g., 1-100">
                  </div>
                </div>
              </div>
              <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                <button @click="cancel()"
                        class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors" x-text="t('common.cancel')"></button>
                <button @click="save()"
                        class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors" x-text="t('common.save')"></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Page: Genre Management -->
        <div x-show="currentPage === 'genre-manage'" x-data="genreManager" x-init="init()" x-cloak>
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900" x-text="t('genre.title')"></h1>
            <p class="text-gray-600 mt-1" x-text="t('genre.description')"></p>
          </div>

          <div class="flex justify-between items-center mb-4">
            <button @click="add()"
                    class="inline-flex items-center gap-2 px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              <span x-text="t('genre.new')"></span>
            </button>
          </div>

          <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase" x-text="t('genre.name')"></th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase" x-text="t('genre.slug')"></th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase" x-text="t('genre.desc')"></th>
                  <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase" x-text="t('common.actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                <template x-for="(genre, index) in genres" :key="genre.slug || genre.genre">
                  <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4">
                      <span class="font-medium text-gray-900" x-text="genre.name || genre.slug"></span>
                    </td>
                    <td class="px-6 py-4">
                      <code class="px-2 py-1 bg-gray-100 rounded text-sm text-gray-600" x-text="genre.slug || genre.genre"></code>
                    </td>
                    <td class="px-6 py-4 text-gray-600 text-sm" x-text="genre.description || '-'"></td>
                    <td class="px-6 py-4 text-right">
                      <button @click="edit(genre)" class="text-primary-600 hover:text-primary-800 mr-3" x-text="t('genre.edit')"></button>
                      <button @click="remove(genre)" class="text-red-600 hover:text-red-800" x-text="t('genre.delete')"></button>
                    </td>
                  </tr>
                </template>
                <tr x-show="genres.length === 0">
                  <td colspan="4" class="px-6 py-12 text-center text-gray-500" x-text="t('genre.empty')"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Genre Modal -->
          <div x-show="editing !== null" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
               @click.self="cancel()">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
              <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900" x-text="editing ? t('genre.edit') : t('genre.new')"></h3>
              </div>
              <div class="p-6 space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('genre.slug')"></label>
                  <input type="text" x-model="form.slug"
                         :disabled="editing"
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 disabled:bg-gray-100">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('genre.name')"></label>
                  <input type="text" x-model="form.name"
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('genre.desc')"></label>
                  <textarea x-model="form.description" rows="3"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"></textarea>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('genre.aliases')"></label>
                  <input type="text" x-model="form.aliases"
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                         placeholder="逗号分隔">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('genre.elements')"></label>
                  <input type="text" x-model="form.elements"
                         class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                         placeholder="逗号分隔">
                </div>
              </div>
              <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                <button @click="cancel()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg" x-text="t('common.cancel')"></button>
                <button @click="save()" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700" x-text="t('common.save')"></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Page: Category Management -->
        <div x-show="currentPage === 'category-manage'" x-data="categoryManager" x-init="init()" x-cloak>
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900" x-text="t('category.title')"></h1>
            <p class="text-gray-600 mt-1" x-text="t('category.description')"></p>
          </div>

          <div class="flex justify-between items-center mb-4">
            <button @click="add()"
                    class="inline-flex items-center gap-2 px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              <span x-text="t('category.new')"></span>
            </button>
          </div>

          <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase" x-text="t('category.name')"></th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase" x-text="t('category.slug')"></th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase" x-text="t('category.icon')"></th>
                  <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase" x-text="t('common.actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                <template x-for="(cat, index) in categories" :key="cat.id">
                  <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4">
                      <div class="flex items-center gap-2">
                        <span x-text="cat.is_standard ? '🔒' : ''"></span>
                        <span class="font-medium text-gray-900" x-text="cat.name"></span>
                      </div>
                    </td>
                    <td class="px-6 py-4">
                      <code class="px-2 py-1 bg-gray-100 rounded text-sm text-gray-600" x-text="cat.slug"></code>
                    </td>
                    <td class="px-6 py-4 text-2xl" x-text="cat.icon || '📁'"></td>
                    <td class="px-6 py-4 text-right">
                      <button @click="edit(cat)" class="text-primary-600 hover:text-primary-800 mr-3" x-text="t('category.edit')"></button>
                      <button @click="remove(cat)" class="text-red-600 hover:text-red-800" :disabled="cat.is_standard" x-text="t('category.delete')"></button>
                    </td>
                  </tr>
                </template>
                <tr x-show="categories.length === 0">
                  <td colspan="4" class="px-6 py-12 text-center text-gray-500" x-text="t('category.empty')"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Page Placeholders -->
        <template x-for="page in ['level-character', 'level-skill', 'level-tech', 'catalog-item', 'catalog-skill', 'world-location', 'world-creature', 'binding-matrix', 'knowledge-pack', 'story-canon', 'story-entities', 'story-rules', 'system-health', 'system-models']" :key="page">
          <div x-show="currentPage === page" class="flex flex-col items-center justify-center h-96" x-cloak>
            <div class="text-6xl mb-4">🚧</div>
            <h2 class="text-xl font-semibold text-gray-700 mb-2" x-text="t(router.getRoute(page)?.titleKey || page)"></h2>
            <p class="text-gray-500">功能开发中...</p>
          </div>
        </template>

      </div>

    </main>

    <!-- Toast Container -->
    <div class="fixed bottom-4 right-4 z-50 space-y-2" x-data="toastContainer">
      <template x-for="toast in toasts" :key="toast.id">
        <div class="flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white max-w-sm transform transition-all duration-300"
             :class="{
               'bg-green-500': toast.type === 'success',
               'bg-red-500': toast.type === 'error',
               'bg-yellow-500': toast.type === 'warning',
               'bg-blue-500': toast.type === 'info'
             }"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 translate-y-2">
          <span class="text-xl" x-text="getIcon(toast.type)"></span>
          <div class="flex-1">
            <div class="font-medium" x-text="toast.title"></div>
            <div class="text-sm opacity-90" x-text="toast.message" x-show="toast.message"></div>
          </div>
          <button @click="remove(toast.id)" class="text-white/80 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </template>
    </div>

  </div>

  <!-- Scripts -->
  <script defer src="js/alpine.min.js"></script>

  <!-- Core Modules (defer to ensure Alpine loads first) -->
  <script defer src="js/app.js"></script>
  <script defer src="js/core/api-wrapper.js"></script>
  <script defer src="js/core/store.js"></script>
  <script defer src="js/core/router.js"></script>
  <script defer src="js/core/i18n.js"></script>

  <!-- Components (defer) -->
  <script defer src="js/components/toast-container.js"></script>
  <script defer src="js/components/data-table.js"></script>
  <script defer src="js/components/modal-dialog.js"></script>
  <script defer src="js/components/form-builder.js"></script>
  <script defer src="js/components/loading-overlay.js"></script>

  <!-- Page Components -->
  <script defer>
    // Wait for all deferred scripts to load
    function waitForModules() {
      return new Promise((resolve) => {
        const check = () => {
          if (window.apiClient && window.i18n && window.router && Alpine) {
            resolve();
          } else {
            setTimeout(check, 100);
          }
        };
        check();
      });
    }

    // Helper to safely access apiClient
    function getApiClient() {
      if (!window.apiClient) {
        throw new Error('apiClient not initialized');
      }
      return window.apiClient;
    }

    // Initialize after DOM and scripts are ready
    document.addEventListener('DOMContentLoaded', async () => {
      // Wait for all modules to be available
      await waitForModules();

      // Initialize i18n
      await window.i18n.init('zh');

      // Register Alpine components
      registerComponents();
    });

    function registerComponents() {

      Alpine.data('appShell', () => ({
        // 状态
        currentPage: 'level-item',
        currentLang: 'zh',
        loading: false,
        loadingMessage: '',
        sidebarCollapsed: false,

        // 工作区/项目
        workspace: 'default',
        project: '',
        workspaces: [],
        projects: [],

        // 面包屑
        breadcrumbs: [{ label: '首页', page: null }],

        // 菜单组
        menuGroups: [],

        /**
         * 初始化
         */
        async init() {
          // 使用当前i18n语言
          this.currentLang = window.i18n.getCurrentLang();

          // 构建菜单
          this.buildMenu();

          // 加载工作区
          await this.loadWorkspaces();

          // 初始化路由
          window.router.initFromHash();

          // 监听路由变化
          window.addEventListener('route:changed', (e) => {
            this.currentPage = e.detail.pageId;
            this.updateBreadcrumbs();
          });
        },

        /**
         * 构建菜单
         */
        buildMenu() {
          this.menuGroups = window.router.buildMenu((key) => this.t(key));
        },

        /**
         * 加载工作区
         */
        async loadWorkspaces() {
          try {
            this.workspaces = await getApiClient().workspace.list({ showLoading: false });
            if (this.workspaces.length > 0) {
              this.workspace = this.workspaces[0].slug;
              await this.loadProjects();
            }
          } catch (error) {
            console.error('Failed to load workspaces:', error);
          }
        },

        /**
         * 加载项目
         */
        async loadProjects() {
          if (!this.workspace) return;
          try {
            this.projects = await getApiClient().project.list(this.workspace, { showLoading: false });
            if (this.projects.length > 0 && !this.project) {
              this.project = this.projects[0].slug;
            }
          } catch (error) {
            console.error('Failed to load projects:', error);
          }
        },

        /**
         * 切换工作区
         */
        async changeWorkspace(ws) {
          this.workspace = ws;
          this.project = '';
          await this.loadProjects();
          window.dispatchEvent(new CustomEvent('workspace:changed', { detail: { workspace: ws } }));
        },

        /**
         * 切换项目
         */
        changeProject(project) {
          this.project = project;
          window.dispatchEvent(new CustomEvent('project:changed', { detail: { project } }));
        },

        /**
         * 导航
         */
        navigate(pageId) {
          window.router.navigate(pageId);
        },

        /**
         * 更新面包屑
         */
        updateBreadcrumbs() {
          const route = window.router.getRoute(this.currentPage);
          if (route) {
            this.breadcrumbs = [
              { label: this.t('nav.home'), page: null },
              { label: route.groupLabel, page: null },
              { label: this.t(route.titleKey) || route.title, page: null }
            ];
          }
        },

        /**
         * 切换语言
         */
        toggleLang() {
          const newLang = this.currentLang === 'zh' ? 'en' : 'zh';
          window.i18n.setLang(newLang);
          this.currentLang = newLang;
          this.buildMenu(); // 重建菜单以更新翻译
        },

        /**
         * 翻译
         */
        t(key, params = {}) {
          return window.i18n.t(key, params);
        },

        /**
         * 登出
         */
        logout() {
          // TODO: 实现登出逻辑
          window.showToast('info', '登出', '功能开发中');
        },

        /**
         * 获取toasts（从store）
         */
        get toasts() {
          return Alpine.store('app')?.toasts || [];
        }
      }));

      // Item Level Manager
      Alpine.data('itemLevelManager', () => ({
        levels: [],
        editing: null,
        form: { name: '', desc: '', order: 1, range: '' },
        categoryId: null,

        async init() {
          await this.loadCategory();
          await this.load();
        },

        async loadCategory() {
          const ws = Alpine.store('app')?.workspace || 'default';
          try {
            const cat = await getApiClient().setting.get(ws, 'item-level', { showLoading: false });
            this.categoryId = cat?.id || cat?.result?.id;
          } catch (error) {
            console.error('Failed to load category:', error);
          }
        },

        async load() {
          if (!this.categoryId) return;
          const ws = Alpine.store('app')?.workspace || 'default';
          try {
            this.levels = await getApiClient().item.list(ws, this.categoryId, { showLoading: false });
          } catch (error) {
            console.error('Failed to load levels:', error);
            window.showToast('error', '加载失败', error.message);
          }
        },

        add() {
          this.editing = -1;
          this.form = { name: '', desc: '', order: this.levels.length + 1, range: '' };
        },

        edit(index) {
          const level = this.levels[index];
          this.editing = index;
          this.form = {
            name: level.core_summary || level.name || '',
            desc: level.detailed_expansion || level.data?.description || '',
            order: level.sort_order || index + 1,
            range: level.data?.numeric_range || ''
          };
        },

        cancel() {
          this.editing = null;
          this.form = { name: '', desc: '', order: 1, range: '' };
        },

        async save() {
          if (!this.form.name) {
            window.showToast('warning', '验证失败', '请填写等级名称');
            return;
          }

          const ws = Alpine.store('app')?.workspace || 'default';
          try {
            await getApiClient().item.upsert(ws, {
              category_id: this.categoryId,
              core_summary: this.form.name,
              detailed_expansion: this.form.desc,
              sort_order: this.form.order,
              data: { numeric_range: this.form.range },
              is_global: true
            });

            window.showToast('success', '保存成功');
            this.cancel();
            await this.load();
          } catch (error) {
            console.error('Failed to save:', error);
            window.showToast('error', '保存失败', error.message);
          }
        },

        async remove(index) {
          const level = this.levels[index];
          if (!confirm(`确定删除 "${level.core_summary || level.name}" 吗？`)) return;

          const ws = Alpine.store('app')?.workspace || 'default';
          try {
            await getApiClient().item.delete(ws, level.id);
            window.showToast('success', '删除成功');
            await this.load();
          } catch (error) {
            console.error('Failed to delete:', error);
            window.showToast('error', '删除失败', error.message);
          }
        }
      }));

      // Genre Manager
      Alpine.data('genreManager', () => ({
        genres: [],
        editing: null,
        form: { slug: '', name: '', description: '', aliases: '', elements: '' },

        async init() {
          await this.load();
        },

        async load() {
          try {
            this.genres = await getApiClient().genre.list({ showLoading: false });
          } catch (error) {
            console.error('Failed to load genres:', error);
            window.showToast('error', '加载失败', error.message);
          }
        },

        add() {
          this.editing = null;
          this.form = { slug: '', name: '', description: '', aliases: '', elements: '' };
        },

        edit(genre) {
          this.editing = genre.slug || genre.genre;
          this.form = {
            slug: genre.slug || genre.genre,
            name: genre.name || '',
            description: genre.description || '',
            aliases: (genre.aliases || []).join(', '),
            elements: (genre.typical_elements || []).join(', ')
          };
        },

        cancel() {
          this.editing = null;
          this.form = { slug: '', name: '', description: '', aliases: '', elements: '' };
        },

        async save() {
          if (!this.form.slug || !this.form.name) {
            window.showToast('warning', '验证失败', '请填写标识和名称');
            return;
          }

          try {
            await getApiClient().genre.upsert({
              slug: this.form.slug,
              name: this.form.name,
              description: this.form.description,
              aliases: this.form.aliases.split(',').map(s => s.trim()).filter(Boolean),
              typical_elements: this.form.elements.split(',').map(s => s.trim()).filter(Boolean)
            });

            window.showToast('success', '保存成功');
            this.cancel();
            await this.load();
          } catch (error) {
            console.error('Failed to save genre:', error);
            window.showToast('error', '保存失败', error.message);
          }
        },

        async remove(genre) {
          const slug = genre.slug || genre.genre;
          if (!confirm(`确定删除 "${slug}" 吗？`)) return;

          try {
            await getApiClient().genre.delete(slug);
            window.showToast('success', '删除成功');
            await this.load();
          } catch (error) {
            console.error('Failed to delete genre:', error);
            window.showToast('error', '删除失败', error.message);
          }
        }
      }));

      // Category Manager
      Alpine.data('categoryManager', () => ({
        categories: [],
        editing: null,
        form: { slug: '', name: '', icon: '📁', description: '', typeDesc: '' },

        async init() {
          await this.load();
        },

        async load() {
          const ws = Alpine.store('app')?.workspace || 'default';
          try {
            this.categories = await getApiClient().setting.list(ws, { showLoading: false });
          } catch (error) {
            console.error('Failed to load categories:', error);
            window.showToast('error', '加载失败', error.message);
          }
        },

        add() {
          this.editing = null;
          this.form = { slug: '', name: '', icon: '📁', description: '', typeDesc: '' };
        },

        edit(cat) {
          this.editing = cat.id;
          this.form = {
            slug: cat.slug,
            name: cat.name,
            icon: cat.icon || '📁',
            description: cat.description || '',
            typeDesc: cat.metadata?.type_description || ''
          };
        },

        cancel() {
          this.editing = null;
          this.form = { slug: '', name: '', icon: '📁', description: '', typeDesc: '' };
        },

        async save() {
          if (!this.form.slug || !this.form.name) {
            window.showToast('warning', '验证失败', '请填写标识和名称');
            return;
          }

          const ws = Alpine.store('app')?.workspace || 'default';
          try {
            await getApiClient().setting.upsert(ws, {
              slug: this.form.slug,
              name: this.form.name,
              icon: this.form.icon,
              description: this.form.description,
              metadata: { type_description: this.form.typeDesc }
            });

            window.showToast('success', '保存成功');
            this.cancel();
            await this.load();
          } catch (error) {
            console.error('Failed to save category:', error);
            window.showToast('error', '保存失败', error.message);
          }
        },

        async remove(cat) {
          if (cat.is_standard) {
            window.showToast('warning', '无法删除', '系统分类不可删除');
            return;
          }

          if (!confirm(`确定删除 "${cat.name}" 吗？`)) return;

          const ws = Alpine.store('app')?.workspace || 'default';
          try {
            await getApiClient().setting.delete(ws, cat.id);
            window.showToast('success', '删除成功');
            await this.load();
          } catch (error) {
            console.error('Failed to delete category:', error);
            window.showToast('error', '删除失败', error.message);
          }
        }
      }));

    });
  </script>

</body>
</html>
