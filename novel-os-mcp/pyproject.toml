[project]
name = "novel-os-mcp"
version = "0.1.0"
description = "Central MCP server for long-form webnovel memory, rules, plot, and review management."
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "asyncpg>=0.29.0",
  "qdrant-client>=1.9.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.1",
  "bcrypt>=4.0.0",
]

[project.scripts]
novel-os-mcp = "novel_os_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_os_mcp"]

